[project]
name = "financial-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.2",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langchain-aws>=1.9.0",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-redis>=0.5.2",
    "llama-index-core>=0.10.45",
    "llama-index-embeddings-bedrock>=0.2.1",
    "llama-index-embeddings-huggingface>=0.2.3",
    "llama-index-vector-stores-redis>=0.1.2",
    "ml-dtypes>=0.5",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "redis>=5.3.1",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs real infrastructure (Redis Stack); skipped by default, run with -m integration",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
